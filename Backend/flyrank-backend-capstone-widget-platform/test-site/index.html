<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Customer Site (different origin) — Widget Test Page</title>
</head>
<body>
  <h1>Acme Inc — a totally unrelated website</h1>
  <p>This page is served from a different origin than the widget API,
     to prove cross-origin embedding actually works.</p>

  <!--
    Run this page with:  python -m http.server 5500   (from inside test-site/)
    Run the API with:    docker compose up             (serves on :8000)
    Then open:            http://localhost:5500
    Replace WIDGET_ID below with the id printed by seed.py
  -->
  <script src="http://localhost:8000/widget.js?id=WIDGET_ID" async></script>
</body>
</html>
